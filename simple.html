<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV · Chakib Selhi, étudiant en génie logiciel</title>
<meta name="description" content="CV de Chakib Selhi, étudiant en génie logiciel à l'UQAM, à la recherche d'un stage en cybersécurité, analyse, développement ou TI.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/simple.css?v=20261104052215">
</head>
<body>
<nav class="topbar" aria-label="Navigation">
  <a href="index.html" data-i18n="simple.back">← Retour à ChakibOS</a>
  <span class="topbar__actions">
    <button type="button" class="ghost" id="lang" data-i18n="simple.lang">English</button>
    <button type="button" class="print" id="print" data-i18n="simple.print">Imprimer / PDF</button>
  </span>
</nav>
<main id="cv" class="paper cv"></main>
<noscript><p class="paper">Ce CV s'affiche avec JavaScript. / This résumé needs JavaScript. chakibselhi@gmail.com</p></noscript>
<script src="js/data.js?v=20261104052215"></script>
<script src="js/i18n.js?v=20261104052215"></script>
<script src="js/github.js?v=20261104052215"></script>
<script src="js/cv.js?v=20261104052215"></script>
<script>
  (function () {
    var cv = document.getElementById("cv");
    function render() {
      window.I18N.apply(document, "meta.titleSimple");
      cv.innerHTML = window.renderCV(window.PORTFOLIO, { detail: true });
    }
    // Les dépôts GitHub publics complètent le CV dès qu'ils sont chargés (et à chaque mise à jour).
    document.addEventListener("githubsync", render);
    document.addEventListener("langchange", render);
    render();
    window.GITHUB.sync();
    document.getElementById("lang").addEventListener("click", function () { window.I18N.toggle(); });
    document.getElementById("print").addEventListener("click", function () { window.print(); });
  })();
</script>
</body>
</html>
